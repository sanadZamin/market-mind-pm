openapi: 3.1.0
info:
  title: Market Mind PM API
  version: 0.1.0
  license:
    name: MIT
    identifier: MIT
  description: |
    HTTP API for the Market Mind project management tool (Spring Boot and Node implementations share these route shapes).

    **Base path:** All paths below are served under the servlet context **`/api`** (e.g. `https://host/api/projects`).

    When the SPA is deployed under a subpath (e.g. **`/pm`**), the browser calls **`/pm/api/...`**; reverse proxies typically forward that to the backend **`/api/...`**.

    **Authentication:** Most routes require `Authorization: Bearer <token>` from `POST /auth/login` or `POST /auth/register`.

    **Not HTTP:** A scheduled job sends a daily **delayed tasks digest** email (config: `pm.delayed-task-digest.*` / `PM_DELAYED_TASK_DIGEST_*`). There is no REST endpoint for that digest.

    **Health probes:** Actuator routes are documented under `paths` (`/actuator/health`, `/actuator/health/liveness`). No Bearer token required.
servers:
  - url: /api
    description: API root (Spring `server.servlet.context-path=/api`)
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: projects
    description: Project management
  - name: tasks
    description: Task management
  - name: members
    description: Team members
  - name: comments
    description: Task comments
  - name: import
    description: Excel import
  - name: ai
    description: AI-assisted text (Ollama)
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "429":
          description: Rate limited (e.g. by API gateway)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /actuator/health:
    get:
      operationId: actuatorHealth
      tags: [health]
      summary: Spring Boot aggregate health (Actuator)
      security: []
      responses:
        "200":
          description: Component health JSON (UP/DOWN, etc.)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /actuator/health/liveness:
    get:
      operationId: actuatorHealthLiveness
      tags: [health]
      summary: Liveness probe for orchestrators
      security: []
      responses:
        "200":
          description: Liveness state
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register new user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: Registration successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      security: []
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Malformed request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List all projects
      responses:
        "200":
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectRequest"
      responses:
        "201":
          description: Project created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /projects/rephrase-description:
    post:
      operationId: rephraseProjectDescriptionDraft
      tags: [ai, projects]
      summary: Rephrase project description (create flow, before project exists)
      description: Uses Ollama. Optional `name` defaults to "Untitled project" when blank.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RephraseProjectDraftRequest"
      responses:
        "200":
          description: Rewritten description
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RephraseDescriptionResponse"
        "400":
          description: Missing description
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Ollama or upstream failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OllamaErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /projects/{projectId}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Project details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: updateProject
      tags: [projects]
      summary: Update a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectRequest"
      responses:
        "200":
          description: Project updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteProject
      tags: [projects]
      summary: Delete a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Project deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /projects/{projectId}/rephrase-description:
    post:
      operationId: rephraseProjectDescription
      tags: [ai, projects]
      summary: Rephrase project description for an existing project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RephraseDescriptionRequest"
      responses:
        "200":
          description: Rewritten description
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RephraseDescriptionResponse"
        "400":
          description: Missing description
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Ollama or upstream failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OllamaErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /projects/{projectId}/import-excel:
    post:
      operationId: importExcelPreview
      tags: [import, tasks]
      summary: Parse an Excel file into a task preview (no DB writes)
      description: |
        Upload the first worksheet as `file` (multipart). Returns normalized `tasks` for the UI preview.
        On LLM mapping failure, `llmError` may be set and `rawRows` included for debugging.
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                  description: Excel workbook (.xlsx / .xls)
      responses:
        "200":
          description: Parsed task rows
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExcelImportPreviewResponse"
        "400":
          description: Empty file, parse error, or unusable sheet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /projects/{projectId}/tasks:
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List top-level tasks for a project
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
        - name: status
          in: query
          schema:
            type: string
            enum: [todo, in_progress, in_review, done]
        - name: priority
          in: query
          schema:
            type: string
            enum: [low, medium, high, urgent]
      responses:
        "200":
          description: List of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createTask
      tags: [tasks]
      summary: Create a task
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTaskRequest"
      responses:
        "201":
          description: Task created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /projects/{projectId}/tasks/rephrase-description:
    post:
      operationId: rephraseTaskDescriptionDraft
      tags: [ai, tasks]
      summary: Rephrase task description (create flow, before task exists)
      description: |
        `projectId` is accepted for routing consistency; the draft uses `title` and `description` from the body only.
        Optional `title` defaults to "Untitled task" when blank.
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RephraseTaskDraftRequest"
      responses:
        "200":
          description: Rewritten description
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RephraseDescriptionResponse"
        "400":
          description: Missing description
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Ollama or upstream failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OllamaErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /projects/{projectId}/tasks/bulk:
    post:
      operationId: bulkCreateTasks
      tags: [import, tasks]
      summary: Create many tasks (and subtasks) from a normalized import payload
      description: |
        Typically called after `POST .../import-excel` with the `tasks` array from the preview.
        Assignee strings are resolved to user IDs by exact name or email match (case-insensitive).
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkCreateTasksRequest"
      responses:
        "201":
          description: Number of tasks inserted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkCreateTasksResponse"
        "400":
          description: Invalid body
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /tasks/{taskId}:
    get:
      operationId: getTask
      tags: [tasks]
      summary: Get a task
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Task details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      operationId: updateTask
      tags: [tasks]
      summary: Update a task
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTaskRequest"
      responses:
        "200":
          description: Task updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          description: Task not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteTask
      tags: [tasks]
      summary: Delete a task
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Task deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /tasks/{taskId}/rephrase-description:
    post:
      operationId: rephraseTaskDescription
      tags: [ai, tasks]
      summary: Rephrase task description for an existing task
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RephraseDescriptionRequest"
      responses:
        "200":
          description: Rewritten description
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RephraseDescriptionResponse"
        "400":
          description: Missing description
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Task not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: Ollama or upstream failure
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OllamaErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /tasks/{taskId}/subtasks:
    get:
      operationId: listSubtasks
      tags: [tasks]
      summary: List subtasks of a task
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of subtasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Task"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createSubtask
      tags: [tasks]
      summary: Create a subtask
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubtaskRequest"
      responses:
        "201":
          description: Subtask created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /tasks/{taskId}/dependencies:
    get:
      operationId: listTaskDependencies
      tags: [tasks]
      summary: List tasks that block this task
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of dependencies
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskDependency"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: addTaskDependency
      tags: [tasks]
      summary: Add a blocker dependency
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddDependencyRequest"
      responses:
        "201":
          description: Dependency added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDependency"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /tasks/{taskId}/dependencies/{dependsOnId}:
    delete:
      operationId: removeTaskDependency
      tags: [tasks]
      summary: Remove a blocker dependency
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
        - name: dependsOnId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Dependency removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /tasks/{taskId}/comments:
    get:
      operationId: listComments
      tags: [comments]
      summary: List comments for a task
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of comments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Comment"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      operationId: createComment
      tags: [comments]
      summary: Create a comment
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCommentRequest"
      responses:
        "201":
          description: Comment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Comment"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /users:
    get:
      operationId: listUsers
      tags: [members]
      summary: List all users (team members)
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Value of `token` from `POST /auth/login` or `POST /auth/register` (`Authorization` header).

  responses:
    Unauthorized:
      description: Missing or invalid Bearer token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
      required:
        - error

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
      required:
        - success

    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
        avatarUrl:
          type: [string, "null"]
        role:
          type: string
          enum: [admin, member]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - email
        - role
        - createdAt

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required:
        - email
        - password

    RegisterRequest:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
          format: email
        password:
          type: string
      required:
        - name
        - email
        - password

    AuthResponse:
      type: object
      properties:
        user:
          $ref: "#/components/schemas/User"
        token:
          type: string
      required:
        - user
        - token

    Project:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: [string, "null"]
        color:
          type: string
        status:
          type: string
          enum: [active, archived, completed]
        ownerId:
          type: integer
        startDate:
          anyOf:
            - type: string
              format: date
            - type: "null"
        endDate:
          anyOf:
            - type: string
              format: date
            - type: "null"
        taskCount:
          type: integer
        completedTaskCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - color
        - status
        - ownerId
        - taskCount
        - completedTaskCount
        - createdAt
        - updatedAt

    CreateProjectRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        color:
          type: string
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date
      required:
        - name
        - color

    UpdateProjectRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        color:
          type: string
        status:
          type: string
          enum: [active, archived, completed]
        startDate:
          type: string
          format: date
        endDate:
          type: string
          format: date

    Task:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: [string, "null"]
        status:
          type: string
          enum: [todo, in_progress, in_review, done]
        priority:
          type: string
          enum: [low, medium, high, urgent]
        projectId:
          type: integer
        parentTaskId:
          type: [integer, "null"]
        assigneeId:
          type: [integer, "null"]
        reporterId:
          type: integer
        assignee:
          anyOf:
            - $ref: "#/components/schemas/User"
