# Production compose for remote deploy (copy to server as docker-compose.yml).
# Jenkins Deploy stage exports IMAGE_TAG, DOCKER_REPO_API, DOCKER_REPO_WEB before pull/up.
#
# Prerequisites on host:
#   - docker-compose (classic CLI) or docker compose v2
#   - docker login (or pull via Jenkins only — ensure host can pull private images)
#   - Postgres reachable (external container or add a db service)
#   - nginx.conf in this directory if using the nginx service below

services:
  springapi:
    image: ${DOCKER_REPO_API:-altshiftcreative/marketmind-springapi}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      PORT: 8081
      PGHOST: ${PGHOST:-hayyah-postgres}
      PGPORT: ${PGPORT:-5432}
      PGDATABASE: ${PGDATABASE:-marketmind}
      PGUSER: ${PGUSER:-postgres}
      PGPASSWORD: ${PGPASSWORD:?set PGPASSWORD}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-resend}
      SMTP_PASS: ${SMTP_PASS:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_LOGO_PATH: ${EMAIL_LOGO_PATH:-/app/assets/logo.png}
      PM_TOOL_BASE_URL: ${PM_TOOL_BASE_URL:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://149.102.140.178:7869}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:0.8b}
      OLLAMA_THINK: ${OLLAMA_THINK:-false}
    expose:
      - "8081/tcp"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8081/api/actuator/health/liveness >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 90s

  web:
    image: ${DOCKER_REPO_WEB:-altshiftcreative/marketmind-web}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    ports:
      - "84:80"
    depends_on:
      springapi:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      springapi:
        condition: service_healthy
