# Production compose — synced to the deploy host by Jenkins (see Jenkinsfile Deploy stage).
# Secrets (PGPASSWORD, SMTP_*, etc.) stay in DEPLOY_DIR/.env on the server.
# Jenkins exports IMAGE_API and IMAGE_WEB before pull/up.

services:
  springapi:
    image: ${IMAGE_API:?set IMAGE_API}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 8081
      PGHOST: ${PGHOST:-hayyah-postgres}
      PGPORT: ${PGPORT:-5432}
      PGDATABASE: ${PGDATABASE:-marketmind}
      PGUSER: ${PGUSER:-postgres}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-resend}
      SMTP_SECURE: ${SMTP_SECURE:-true}
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      EMAIL_LOGO_PATH: ${EMAIL_LOGO_PATH:-/app/assets/logo.png}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://149.102.140.178:7869}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:0.8b}
      OLLAMA_THINK: ${OLLAMA_THINK:-false}
    expose:
      - "8081/tcp"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8081/api/actuator/health/liveness >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 90s

  web:
    image: ${IMAGE_WEB:?set IMAGE_WEB}
    restart: unless-stopped
    ports:
      - "84:80"
    depends_on:
      springapi:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      springapi:
        condition: service_healthy
