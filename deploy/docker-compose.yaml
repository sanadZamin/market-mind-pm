# Reference compose for manual / server setup — Jenkins does NOT copy this to the host.
# Edit the copy in DEPLOY_DIR on your server. Jenkins exports IMAGE_API / IMAGE_WEB before pull/up.

services:
  springapi:
    image: ${IMAGE_API:?set IMAGE_API}
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 8081
      EMAIL_LOGO_PATH: /app/assets/logo.png
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://149.102.140.178:7869}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:0.8b}
      OLLAMA_THINK: ${OLLAMA_THINK:-false}
    expose:
      - "8081/tcp"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://127.0.0.1:8081/api/healthz >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 120s

  web:
    image: ${IMAGE_WEB:?set IMAGE_WEB}
    restart: unless-stopped
    ports:
      - "84:80"
    depends_on:
      springapi:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      springapi:
        condition: service_healthy
