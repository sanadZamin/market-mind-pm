server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Stable Docker / probe URL (independent of SPA base path /pm/).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok\n';
    }

    location /api/ {
        # Use springapi — there is often no separate "api" container (Node) in compose.
        proxy_pass http://springapi:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Spring Boot PM API compatibility under the /pm base path.
    # Upstream receives requests under /api/* because the Spring app uses context-path /api.
    location /pm/api/ {
        proxy_pass http://springapi:8081/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
