server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Stable Docker / probe URL (independent of SPA base path /pm/).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 'ok\n';
    }

    location /api/ {
        # Use springapi — there is often no separate "api" container (Node) in compose.
        proxy_pass http://springapi:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Spring Boot PM API compatibility under the /pm base path.
    # Upstream receives requests under /api/* because the Spring app uses context-path /api.
    location /pm/api/ {
        proxy_pass http://springapi:8081/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Normalize bare /pm to login route.
    location = /pm {
        return 302 /pm/login;
    }

    # Serve built static assets directly even if clients request root paths
    # (e.g. stale cached HTML pointing to /assets/* instead of /pm/assets/*).
    location /assets/ {
        try_files $uri =404;
    }

    location /images/ {
        try_files $uri =404;
    }

    # Client-side routes without the /pm prefix (bookmarks, emails, old links).
    # The build still uses base /pm/ for assets; the SPA matches these paths with wouter base "".
    location ~ ^/(projects|dashboard|pricing|resources|demo|register|login|mm-workbench)(/.*)?$ {
        try_files $uri /index.html;
    }

    # Serve frontend app and static assets under /pm/*.
    # Strip the /pm prefix so /pm/assets/* maps to /assets/* on disk.
    location /pm/ {
        rewrite ^/pm/(.*)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }
}
